name: Sync schedule from Canvas

on:
  schedule:
    # Hourly from 6am to 7pm Eastern. Cron is UTC; EDT is UTC-4, EST is UTC-5,
    # so this window covers the school day year-round.
    - cron: "0 10-23 * * *"
  workflow_dispatch:        # lets you force a sync from the Actions tab
  push:
    branches: [main]
    paths:
      - "data/baseline.json"
      - "data/overrides.json"
      - "scripts/**"

concurrency:
  group: schedule-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync
        env:
          CANVAS_BASE_URL: ${{ vars.CANVAS_BASE_URL || 'https://webcourses.ucf.edu' }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: python3 scripts/sync_canvas.py

      - name: Commit any changes
        run: |
          git config user.name  "canvas-sync[bot]"
          git config user.email "canvas-sync@users.noreply.github.com"

          # Stage first: the generated files are untracked on the very first
          # run, and `git diff` alone does not see untracked files.
          git add -A data schedule.ics

          if git diff --cached --quiet; then
            echo "No schedule changes."
            exit 0
          fi

          # Summarise what moved so the commit message is the change log.
          summary=$(python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/schedule.json")
          changes = json.loads(p.read_text()).get("recentChanges", [])
          if not changes:
              print("refresh schedule data")
          else:
              bits = [f"{c['course']} {c['type']} {c['date']}" for c in changes[:3]]
              extra = f" (+{len(changes)-3} more)" if len(changes) > 3 else ""
              print("; ".join(bits) + extra)
          PY
          )

          git commit -m "sync: $summary"

          # Another run may have landed while this one was working.
          git pull --rebase --autostash origin main
          git push origin main
